<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yousef - Cyber Hologram</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #020108; /* خلفية سيبرانية داكنة جداً */
            overflow: hidden;
            touch-action: none; 
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let textCoords = [];

        // ألوان الهولوغرام والسايبر-بانك (سيان، ماجنتا، بنفسجي، وأبيض رقمي)
        const colors = ['#00F0FF', '#FF003C', '#9D00FF', '#E0FFFF'];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 1. استخراج إحداثيات اسم "يوسف"
        function getTextCoordinates() {
            const offCanvas = document.createElement('canvas');
            const offCtx = offCanvas.getContext('2d');
            offCanvas.width = width;
            offCanvas.height = height;

            // حجم خط متناسب مع الشاشات
            let fontSize = Math.min(width / 2.5, 180); 
            offCtx.font = `900 ${fontSize}px "Segoe UI", sans-serif`;
            offCtx.fillStyle = 'white';
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            
            offCtx.fillText('يوسف', width / 2, height / 2);

            const imgData = offCtx.getImageData(0, 0, width, height).data;
            const coords = [];

            // مسح الشاشة لجمع النقاط (نأخذ نقطة كل 5 بكسلات)
            for (let y = 0; y < height; y += 5) {
                for (let x = 0; x < width; x += 5) {
                    const index = (y * width + x) * 4;
                    if (imgData[index + 3] > 128) { 
                        coords.push({ x: x, y: y });
                    }
                }
            }
            return coords;
        }

        function getBaseHeartPoint() {
            while(true) {
                let x = (Math.random() - 0.5) * 30; 
                let y = (Math.random() - 0.5) * 30; 
                let sx = x;
                let sy = -y; 
                let a = sx*sx + sy*sy - 1;
                if (a*a*a - sx*sx*sy*sy*sy <= 0) {
                    return { x: x, y: y };
                }
            }
        }

        function initParticles() {
            textCoords = getTextCoordinates();
            particles = [];

            for (let i = 0; i < textCoords.length; i++) {
                let heartPt = getBaseHeartPoint();
                particles.push({
                    x: width / 2, 
                    y: height / 2,
                    vx: 0,
                    vy: 0,
                    baseHeartX: heartPt.x,
                    baseHeartY: heartPt.y,
                    targetTextX: textCoords[i].x,
                    targetTextY: textCoords[i].y,
                    size: Math.random() * 2.5 + 1, // جزيئات رقمية
                    color: colors[Math.floor(Math.random() * colors.length)],
                    glitchOffset: Math.random() * 20 // تأثير تشويش رقمي
                });
            }
        }

        initParticles();

        let phase = 'shrinking'; 
        let heartScale = Math.min(width, height) / 25; 
        let time = 0;

        setTimeout(() => {
            phase = 'glitching'; // مرحلة التشويش قبل الانفجار
            setTimeout(() => {
                phase = 'exploding'; 
                particles.forEach(p => {
                    let angle = Math.random() * Math.PI * 2;
                    let force = Math.random() * 35 + 15; // انفجار أقوى وأسرع
                    p.vx = Math.cos(angle) * force;
                    p.vy = Math.sin(angle) * force;
                });

                setTimeout(() => {
                    phase = 'assembling'; 
                }, 900); // الانفجار مدته أقل ليكون حاد وسريع
            }, 500);
        }, 2500); 

        function animate() {
            requestAnimationFrame(animate);
            
            // خلفية شفافة تترك أثر حركي يعطي شكل الـ "ماتريكس"
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(2, 1, 8, 0.25)'; 
            ctx.fillRect(0, 0, width, height);

            ctx.globalCompositeOperation = 'lighter'; // تأثير توهج للألوان

            time += 0.05;

            if (phase === 'shrinking' && heartScale > 1.5) {
                heartScale -= 0.12;
            }

            // حركة طفو الهولوغرام للاسم
            let hoverY = 0;
            if (phase === 'assembling') {
                hoverY = Math.sin(time * 1.5) * 10; // الاسم يطفو للأعلى والأسفل 10 بكسلات
            }

            for (let p of particles) {
                let targetX, targetY;
                let speed = 0.1; // سرعة أعلى للاستايل التكنولوجي

                if (phase === 'shrinking') {
                    targetX = width / 2 + (p.baseHeartX * heartScale);
                    targetY = height / 2 + (p.baseHeartY * heartScale) - 20;
                } else if (phase === 'glitching') {
                    // تأثير الارتجاف الرقمي
                    targetX = width / 2 + (p.baseHeartX * heartScale) + (Math.random() - 0.5) * p.glitchOffset;
                    targetY = height / 2 + (p.baseHeartY * heartScale) - 20 + (Math.random() - 0.5) * p.glitchOffset;
                    speed = 0.5;
                } else if (phase === 'exploding') {
                    targetX = p.x + p.vx;
                    targetY = p.y + p.vy;
                    p.vx *= 0.92; 
                    p.vy *= 0.92;
                } else if (phase === 'assembling') {
                    targetX = p.targetTextX;
                    targetY = p.targetTextY + hoverY; // إضافة الطفو لإحداثيات الهدف
                    speed = 0.07; 
                }

                if (phase !== 'exploding') {
                    let tx = targetX - p.x;
                    let ty = targetY - p.y;
                    p.vx += tx * speed;
                    p.vy += ty * speed;
                    p.vx *= 0.75; 
                    p.vy *= 0.75;
                }

                p.x += p.vx;
                p.y += p.vy;

                // رسم مربعات (بيانات) بدلاً من الدوائر لتعزيز الطابع الرقمي
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            }
        }
        
        animate();
    </script>
</body>
</html>
