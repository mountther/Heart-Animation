<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yousef - Particle Animation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000; /* خلفية سوداء بالكامل تبرز اللون الماروني */
            overflow: hidden;
            touch-action: none; 
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let textCoords = [];

        // ألوان التدرج الماروني والأحمر الداكن والأسود
        const colors = ['#800000', '#4a0000', '#a30000', '#660000', '#330000'];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 1. استخراج إحداثيات اسم "يوسف"
        function getTextCoordinates() {
            const offCanvas = document.createElement('canvas');
            const offCtx = offCanvas.getContext('2d');
            offCanvas.width = width;
            offCanvas.height = height;

            // ضبط الخط (حجم كبير وعريض)
            let fontSize = Math.min(width / 3, 200); 
            offCtx.font = `bold ${fontSize}px Arial`;
            offCtx.fillStyle = 'white';
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            
            // كتابة الاسم في منتصف الشاشة الوهمية
            offCtx.fillText('يوسف', width / 2, height / 2);

            const imgData = offCtx.getImageData(0, 0, width, height).data;
            const coords = [];

            // مسح الشاشة لجمع النقاط (نأخذ نقطة كل 5 بكسلات لتقليل الحمل وزيادة السرعة)
            for (let y = 0; y < height; y += 5) {
                for (let x = 0; x < width; x += 5) {
                    const index = (y * width + x) * 4;
                    if (imgData[index + 3] > 128) { // إذا كان البكسل غير شفاف
                        coords.push({ x: x, y: y });
                    }
                }
            }
            return coords;
        }

        // 2. دالة لاستخراج نقطة عشوائية داخل شكل القلب
        function getBaseHeartPoint() {
            while(true) {
                let x = (Math.random() - 0.5) * 30; // عرض القلب
                let y = (Math.random() - 0.5) * 30; // طول القلب
                let sx = x;
                let sy = -y; 
                let a = sx*sx + sy*sy - 1;
                // إذا كانت النقطة داخل المعادلة الرياضية للقلب
                if (a*a*a - sx*sx*sy*sy*sy <= 0) {
                    return { x: x, y: y };
                }
            }
        }

        // 3. تهيئة الجزيئات
        function initParticles() {
            textCoords = getTextCoordinates();
            particles = [];

            // ننشئ جزيئة لكل نقطة من نقاط الاسم
            for (let i = 0; i < textCoords.length; i++) {
                let heartPt = getBaseHeartPoint();
                particles.push({
                    x: width / 2, // البداية من المركز
                    y: height / 2,
                    vx: 0,
                    vy: 0,
                    baseHeartX: heartPt.x,
                    baseHeartY: heartPt.y,
                    targetTextX: textCoords[i].x,
                    targetTextY: textCoords[i].y,
                    size: Math.random() * 2 + 1, // حجم الجزيئات
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }
        }

        initParticles();

        // متغيرات التحكم بمراحل الأنيميشن
        let phase = 'shrinking'; 
        let heartScale = Math.min(width, height) / 25; // الحجم الابتدائي للقلب
        let time = 0;

        // انتقال المراحل زمنياً
        setTimeout(() => {
            phase = 'exploding'; // الانفجار والتناثر
            particles.forEach(p => {
                let angle = Math.random() * Math.PI * 2;
                let force = Math.random() * 25 + 10; // قوة الانفجار
                p.vx = Math.cos(angle) * force;
                p.vy = Math.sin(angle) * force;
            });

            setTimeout(() => {
                phase = 'assembling'; // التجمع وتشكيل الاسم
            }, 1000);
        }, 3000); // القلب يصغر لمدة 3 ثواني قبل الانفجار

        // 4. حلقة الأنيميشن الرئيسية
        function animate() {
            requestAnimationFrame(animate);
            
            // خلفية شفافة قليلاً لترك أثر حركي ناعم
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; 
            ctx.fillRect(0, 0, width, height);

            time += 0.05;

            // تصغير القلب تدريجياً في المرحلة الأولى
            if (phase === 'shrinking' && heartScale > 2) {
                heartScale -= 0.1;
            }

            // حركة النبض الخفيفة للاسم في المرحلة الأخيرة
            let textPulseScale = 1;
            if (phase === 'assembling') {
                textPulseScale = 1 + Math.sin(time * 2) * 0.03; // نبض خفيف جداً
            }

            for (let p of particles) {
                let targetX, targetY;
                let speed = 0.08; // سرعة الانجذاب

                if (phase === 'shrinking') {
                    // الهدف هو شكل القلب
                    targetX = width / 2 + (p.baseHeartX * heartScale);
                    targetY = height / 2 + (p.baseHeartY * heartScale) - 20;
                } else if (phase === 'exploding') {
                    // في الانفجار لا يوجد هدف، فقط حركة حرة مع احتكاك
                    targetX = p.x + p.vx;
                    targetY = p.y + p.vy;
                    p.vx *= 0.95; // احتكاك الهواء
                    p.vy *= 0.95;
                } else if (phase === 'assembling') {
                    // الهدف هو إحداثيات حرف من اسم "يوسف"
                    // نحسب المركز ونضيف تأثير النبض للاسم
                    let centerX = width / 2;
                    let centerY = height / 2;
                    targetX = centerX + (p.targetTextX - centerX) * textPulseScale;
                    targetY = centerY + (p.targetTextY - centerY) * textPulseScale;
                    speed = 0.05; // حركة أهدأ عند التشكيل
                }

                // حساب المسافة والانجذاب نحو الهدف (Spring physics)
                if (phase !== 'exploding') {
                    let tx = targetX - p.x;
                    let ty = targetY - p.y;
                    p.vx += tx * speed;
                    p.vy += ty * speed;
                    p.vx *= 0.8; // كبح السرعة لعدم الاهتزاز
                    p.vy *= 0.8;
                }

                p.x += p.vx;
                p.y += p.vy;

                // رسم الذرة (الجزيئة)
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
            }
        }
        
        animate();
    </script>
</body>
</html>
