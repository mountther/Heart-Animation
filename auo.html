<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yousef - Perfect Heart Animation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000; 
            overflow: hidden;
            touch-action: none; 
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let textCoords = [];

        // الألوان المارونية والحمراء الداكنة
        const colors = ['#800000', '#4a0000', '#a30000', '#660000', '#330000', '#b30000'];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 1. استخراج إحداثيات اسم "يوسف"
        function getTextCoordinates() {
            const offCanvas = document.createElement('canvas');
            const offCtx = offCanvas.getContext('2d');
            offCanvas.width = width;
            offCanvas.height = height;

            let fontSize = Math.min(width / 2.5, 200); 
            offCtx.font = `bold ${fontSize}px Arial`;
            offCtx.fillStyle = 'white';
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            
            offCtx.fillText('آية', width / 2, height / 2);

            const imgData = offCtx.getImageData(0, 0, width, height).data;
            const coords = [];

            for (let y = 0; y < height; y += 4) { // تقليل المسافة لزيادة عدد الجزيئات والوضوح
                for (let x = 0; x < width; x += 4) {
                    const index = (y * width + x) * 4;
                    if (imgData[index + 3] > 128) { 
                        coords.push({ x: x, y: y });
                    }
                }
            }
            return coords;
        }

        // 2. المعادلة الرياضية المصححة للحصول على شكل قلب مثالي
        function getBaseHeartPoint() {
            while(true) {
                // نطاق المعادلة الدقيق هو بين -1.5 و 1.5
                let x = (Math.random() - 0.5) * 3; 
                let y = (Math.random() - 0.5) * 3; 
                let sx = x;
                let sy = -y; // قلب المحور الصادي ليتوافق مع الشاشة
                let a = sx*sx + sy*sy - 1;
                
                // إذا كانت النقطة داخل حدود القلب
                if (a*a*a - sx*sx*sy*sy*sy <= 0) {
                    return { x: x, y: y };
                }
            }
        }

        function initParticles() {
            textCoords = getTextCoordinates();
            particles = [];

            for (let i = 0; i < textCoords.length; i++) {
                let heartPt = getBaseHeartPoint();
                particles.push({
                    x: width / 2, 
                    y: height / 2,
                    vx: 0,
                    vy: 0,
                    baseHeartX: heartPt.x,
                    baseHeartY: heartPt.y,
                    targetTextX: textCoords[i].x,
                    targetTextY: textCoords[i].y,
                    size: Math.random() * 2 + 1.5, // تكبير الجزيئات قليلاً
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }
        }

        initParticles();

        let phase = 'shrinking'; 
        // تكبير القلب بشكل كبير ليكون واضحاً جداً في البداية
        let heartScale = Math.min(width, height) / 3.5; 
        let time = 0;

        setTimeout(() => {
            phase = 'exploding'; 
            particles.forEach(p => {
                let angle = Math.random() * Math.PI * 2;
                let force = Math.random() * 30 + 10; 
                p.vx = Math.cos(angle) * force;
                p.vy = Math.sin(angle) * force;
            });

            setTimeout(() => {
                phase = 'assembling'; 
            }, 1200);
        }, 3000); 

        function animate() {
            requestAnimationFrame(animate);
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)'; 
            ctx.fillRect(0, 0, width, height);

            time += 0.05;

            // تصغير القلب بشكل أسرع وأكثر وضوحاً
            if (phase === 'shrinking' && heartScale > 10) {
                heartScale -= 0.5;
            }

            let textPulseScale = 1;
            if (phase === 'assembling') {
                textPulseScale = 1 + Math.sin(time * 2.5) * 0.03; 
            }

            for (let p of particles) {
                let targetX, targetY;
                let speed = 0.08; 

                if (phase === 'shrinking') {
                    // رسم القلب بأبعاده المصححة
                    targetX = width / 2 + (p.baseHeartX * heartScale);
                    targetY = height / 2 + (p.baseHeartY * heartScale) - 30;
                } else if (phase === 'exploding') {
                    targetX = p.x + p.vx;
                    targetY = p.y + p.vy;
                    p.vx *= 0.94; 
                    p.vy *= 0.94;
                } else if (phase === 'assembling') {
                    let centerX = width / 2;
                    let centerY = height / 2;
                    targetX = centerX + (p.targetTextX - centerX) * textPulseScale;
                    targetY = centerY + (p.targetTextY - centerY) * textPulseScale;
                    speed = 0.06; 
                }

                if (phase !== 'exploding') {
                    let tx = targetX - p.x;
                    let ty = targetY - p.y;
                    p.vx += tx * speed;
                    p.vy += ty * speed;
                    p.vx *= 0.82; 
                    p.vy *= 0.82;
                }

                p.x += p.vx;
                p.y += p.vy;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
            }
        }
        
        animate();
    </script>
</body>
</html>
