<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Heritage Calm Heart</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050406; 
            overflow: hidden;
            touch-action: none; 
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let bgParticles = [];
        let mouse = { x: -1000, y: -1000 };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mouseout', () => { mouse.x = -1000; mouse.y = -1000; });

        window.addEventListener('touchmove', e => {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        });
        window.addEventListener('touchend', () => { mouse.x = -1000; mouse.y = -1000; });

        function getHeartPoint(t, scale) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            return { x: x * scale, y: -y * scale };
        }

        // ألوان جديدة متناغمة: أحمر دافئ، أصفر ذهبي، وأخضر زمردي
        const heartColors = ['#D91636', '#F2B705', '#04D939'];

        function initHeart() {
            particles = [];
            for (let i = 0; i < Math.PI * 2; i += 0.015) {
                let p = {
                    x: width / 2 + (Math.random() - 0.5) * width,
                    y: height / 2 + (Math.random() - 0.5) * height,
                    vx: 0,
                    vy: 0,
                    size: Math.random() * 2.5 + 1.5, 
                    color: heartColors[Math.floor(Math.random() * heartColors.length)],
                    t: i
                };
                particles.push(p);
            }
        }

        function initBg() {
            bgParticles = [];
            for (let i = 0; i < 100; i++) {
                bgParticles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5 + 0.5,
                    vx: (Math.random() - 0.5) * 0.15, // حركة خلفية أبطأ بكثير
                    vy: (Math.random() - 0.5) * 0.15,
                    alpha: Math.random(),
                    dAlpha: (Math.random() * 0.01) - 0.005,
                    color: 'rgba(255, 215, 0,' // لون غبار ذهبي خفيف
                });
            }
        }

        initHeart();
        initBg();

        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(5, 4, 6, 0.15)'; 
            ctx.fillRect(0, 0, width, height);

            ctx.globalCompositeOperation = 'lighter';

            for(let p of bgParticles) {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha += p.dAlpha;
                
                if(p.alpha <= 0 || p.alpha >= 0.5) p.dAlpha *= -1;
                
                if(p.x < 0) p.x = width;
                if(p.x > width) p.x = 0;
                if(p.y < 0) p.y = height;
                if(p.y > height) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color + Math.abs(p.alpha) + ')';
                ctx.fill();
            }

            // إيقاع حركة بطيء جداً وهادئ (تنفس)
            time += 0.015; 
            let baseScale = Math.min(width, height) / 45; 
            let heartScale = baseScale * (1 + 0.08 * Math.sin(time)); // حركة ناعمة ومريحة

            for (let p of particles) {
                let target = getHeartPoint(p.t, heartScale);
                let targetX = width / 2 + target.x;
                let targetY = height / 2 + target.y - 20; 

                let dx = mouse.x - p.x;
                let dy = mouse.y - p.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                
                let forceX = 0;
                let forceY = 0;
                
                // تفاعل ناعم جداً يشبه إزاحة الماء
                if (dist < 100) {
                    let force = (100 - dist) / 100;
                    forceX = (dx / dist) * force * -3; 
                    forceY = (dy / dist) * force * -3;
                }

                let tx = targetX - p.x;
                let ty = targetY - p.y;
                
                // قوة جذب هادئة وانزلاق سلس
                p.vx += tx * 0.02 + forceX;
                p.vy += ty * 0.02 + forceY;
                
                p.vx *= 0.88;
                p.vy *= 0.88;

                p.x += p.vx;
                p.y += p.vy;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
            }
        }
        
        animate();
    </script>
</body>
</html>
